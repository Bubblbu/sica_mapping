<style>
  #filters-panel {
    order: 2;
    width: 520px;
    min-width: 240px;
    max-width: 520px;
    height: 100%;
    background: #fff;
    border-left: 1px solid #d7dbe5;
    box-shadow: -2px 0 6px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    z-index: 2;
  }

  #filters-panel .pane-resize-handle {
    position: absolute;
    top: 0;
    left: -4px;
    width: 8px;
    bottom: 0;
    cursor: ew-resize;
    user-select: none;
  }

  #filters-panel .pane-resize-handle::after {
    content: "";
    position: absolute;
    top: 20px;
    bottom: 20px;
    right: 3px;
    width: 2px;
    background: #d0d4dd;
    border-radius: 2px;
  }

  #filters-panel .filters-card {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #fff;
  }

  #filters-panel h3 {
    margin: 0 0 12px;
    font-size: 16px;
    color: #1d2533;
  }

  #filters-panel .filter-section {
    margin-bottom: 18px;
  }

  #filters-panel .filter-section h4 {
    margin: 10px 0 8px;
    font-size: 14px;
    color: #27354a;
  }

  #filters-panel label {
    display: block;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #1d2129;
  }

  #filters-panel select,
  #filters-panel input[type="date"],
  #filters-panel input[type="number"],
  #filters-panel input[type="text"],
  #filters-panel input[type="range"] {
    width: 100%;
    box-sizing: border-box;
  }

  #filters-panel input[type="text"] {
    padding: 6px 8px;
    border: 1px solid #cdd1dd;
    border-radius: 4px;
    font-size: 13px;
  }

  #filters-panel .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  #filters-panel .filter-grid label {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    margin-bottom: 0;
    color: #27354a;
  }

  #filters-panel .filter-grid label span {
    margin-bottom: 2px;
  }

  #filters-panel .status-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 12px;
  }

  #filters-panel .status-table th,
  #filters-panel .status-table td {
    border: 1px solid #dde1eb;
    padding: 6px;
    text-align: right;
  }

  #filters-panel .status-table thead th {
    background: #f3f5fb;
    font-weight: 600;
    text-align: right;
  }

  #filters-panel .status-table tbody th {
    text-align: left;
    background: #f8f9fd;
    font-weight: 600;
  }

  #filters-panel .status-table td[data-value="none"] {
    color: #777;
  }

  #filters-panel .filter-tags {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 6px;
    max-height: 160px;
    overflow: auto;
    margin-bottom: 10px;
  }

  #filters-panel .filter-tag {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
  }

  #filters-panel .filter-tag-count {
    color: #6b7280;
    margin-left: 4px;
  }

  #filters-panel .filter-none {
    color: #777;
  }

  #filters-panel .filter-visual {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #filters-panel .filter-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  #filters-panel .filter-actions button {
    flex: 1;
    padding: 4px 6px;
    border: 1px solid #cdd1dd;
    background: #f3f5fb;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  #filters-panel .filter-actions button:hover {
    background: #e6e9f4;
  }

  #filters-panel .filter-building {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Craigslist-style distribution sliders: a bin-count histogram sitting
     directly above each metric's dual-handle range slider. */
  #filters-panel .metric-control {
    margin-bottom: 6px;
  }

  #filters-panel .metric-header {
    font-size: 12px;
    font-weight: 600;
    color: #27354a;
    margin-bottom: 4px;
  }

  #filters-panel .metric-histogram {
    display: flex;
    align-items: flex-end;
    height: 36px;
    gap: 1px;
    margin-bottom: 2px;
  }

  #filters-panel .metric-hist-bar {
    flex: 1 1 0;
    min-width: 1px;
    background: #9db4d8;
    border-radius: 1px 1px 0 0;
  }

  #filters-panel .metric-hist-bar:hover {
    background: #5b7fbd;
  }

  /* Two overlapping range inputs sharing one visual track. Chrome/Firefox
     both auto-render a colored "fill" from the track start to the thumb on
     native range inputs (accent-color) — with two inputs stacked on top of
     each other, the later one's opaque fill buries the other's thumb
     underneath it. Fix: fully disable native track/thumb rendering on both
     (appearance: none) and draw one shared static line via ::before, so
     there's nothing left for either slider to visually cover the other with
     — only the two custom-styled thumb circles are ever painted. */
  #filters-panel .metric-sliders {
    position: relative;
    height: 18px;
  }

  #filters-panel .metric-sliders::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 4px;
    margin-top: -2px;
    background: #cdd1dd;
    border-radius: 2px;
    pointer-events: none;
  }

  #filters-panel .metric-sliders input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 18px;
    margin: 0;
    background: transparent;
    pointer-events: none;
  }

  #filters-panel .metric-sliders input[type="range"]::-webkit-slider-runnable-track {
    -webkit-appearance: none;
    background: transparent;
  }

  #filters-panel .metric-sliders input[type="range"]::-moz-range-track {
    background: transparent;
    border: none;
  }

  #filters-panel .metric-sliders input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    pointer-events: auto;
    width: 14px;
    height: 14px;
    margin-top: 2px;
    border-radius: 50%;
    background: #2f5fb0;
    cursor: pointer;
  }

  #filters-panel .metric-sliders input[type="range"]::-moz-range-thumb {
    pointer-events: auto;
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #2f5fb0;
    cursor: pointer;
  }

  #filters-panel .metric-values {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #6b7280;
    margin-top: 2px;
  }

  #filters-panel .summary-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  #filters-panel .summary-actions button {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
  }

  #filters-panel button#export-visible-csv {
    background: #2f5fb0;
    border-color: #2f5fb0;
    color: #fff;
  }

  #filters-panel button#export-visible-csv:hover {
    background: #27508f;
  }

  #filters-panel button#filter-reset {
    background: #f3f5fb;
    border-color: #cdd1dd;
    color: #27354a;
  }

  #filters-panel button#filter-reset:hover {
    background: #e6e9f4;
  }
</style>
<div id="filters-panel">
  <div class="pane-resize-handle" data-target="#filters-panel" data-side="left" data-min-width="240" data-max-width="520"
    aria-hidden="true"></div>
  <div class="filters-card">
    <div class="filter-section">
      <h3>Map Summary</h3>
      <div class="summary-actions">
        <button type="button" id="export-visible-csv">Export visible buildings (CSV)</button>
        <button type="button" id="filter-reset">Reset filters</button>
      </div>
      <table class="status-table">
        <thead>
          <tr>
            <th></th>
            <th># Units</th>
            <th># Bldgs</th>
            <th># VTU bldgs</th>
            <th># Members</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Total</th>
            <td id="status-total-units" data-value="none">–</td>
            <td id="status-total-buildings" data-value="none">–</td>
            <td id="status-total-vtu" data-value="none">–</td>
            <td id="status-total-members" data-value="none">–</td>
          </tr>
          <tr>
            <th scope="row">In view</th>
            <td id="status-view-units" data-value="none">–</td>
            <td id="status-view-buildings" data-value="none">–</td>
            <td id="status-view-vtu" data-value="none">–</td>
            <td id="status-view-members" data-value="none">–</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="filter-section">
      <h4>Map Display</h4>
      <div class="filter-visual">
        <label><input type="checkbox" id="viz-show-buildings" checked> Show buildings</label>
        <label><input type="checkbox" id="viz-show-blocks" checked> Show blocks</label>
        <label><input type="checkbox" id="viz-hide-empty-blocks"> Hide empty blocks</label>
        <label><input type="checkbox" id="viz-color-blocks" checked> Color-scale blocks (total units)</label>
        <label><input type="checkbox" id="viz-color-vtu" checked> Color-scale buildings w/ VTU members</label>
        <label><input type="checkbox" id="viz-show-neighbourhoods" checked> Show neighbourhoods</label>
      </div>
      <!-- Hidden for now, not removed — re-enable by dropping this style. -->
      <div id="filter-membership-year-section" class="filter-building" style="display:none;"></div>
    </div>
    <h3>Filters</h3>
    <div class="filter-section">
      <h4>Landlords</h4>
      <input type="text" id="owner-search" placeholder="Search landlord / owner name…">
    </div>
    <div class="filter-section">
      <h4>Neighbourhoods</h4>
      <div class="filter-tags" id="filter-neighbourhoods">
        $hood_html
      </div>
      <div class="filter-actions">
        <button type="button" id="hood-select-all">Select all</button>
        <button type="button" id="hood-clear">Clear all</button>
      </div>
    </div>
    <div class="filter-section">
      <h4>Buildings</h4>
      <div id="filter-building-section" class="filter-building"></div>
    </div>
  </div>
</div>
