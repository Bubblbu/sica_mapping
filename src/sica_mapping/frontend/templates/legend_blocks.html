
<style>
  #legend-map {
    position: fixed;
    bottom: 20px;
    z-index: 9998;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #legend-map .legend-card {
    background: white;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  #legend-map .legend-heading {
    font-weight: 600;
    margin: 0;
  }
  #legend-map .legend-gradient {
    height: 12px;
    border: 1px solid #999;
    margin-top: 6px;
  }
  #legend-map .legend-scale {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 6px;
  }
  #legend-map .legend-note {
    font-size: 12px;
    margin-top: 6px;
    color: #414a5a;
  }
  #legend-map .legend-key {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
    font-size: 12px;
  }
  #legend-map .legend-key-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #legend-map .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    flex: 0 0 auto;
  }
</style>
<div id="legend-map" style="left:${legend_left_offset}px; display:none;">
  <div class="legend-card" id="legend-blocks-section">
    <div class="legend-heading">Blocks — total units</div>
    <div class="legend-gradient" style="background: linear-gradient(to right, #c7e9c0, #a1d99b, #74c476, #41ab5d, #238b45, #005a32);"></div>
    <div class="legend-scale">
      $block_ticks_html
    </div>
    <div class="legend-note">Color scaled to 0–$block_max_label units (absolute totals).</div>
  </div>
  <div class="legend-card" id="legend-buildings-section">
    <div class="legend-heading">VTU buildings</div>
    <div class="legend-key">
      <div class="legend-key-row"><span class="legend-swatch" style="background:#cc4778;"></span> Has a VTU member</div>
      <div class="legend-key-row"><span class="legend-swatch" style="background:#9e9e9e;"></span> No VTU member</div>
    </div>
  </div>
</div>
